name: emoji_puzzle_kids
description: "Offline jigsaw puzzle game for 3–5 year olds."
publish_to: 'none'
version: 1.0.0+1

environment:
  # §0 — Flutter stable 3.24+, Dart 3.5+.
  sdk: ^3.5.0
  flutter: ">=3.24.0"

# §37 — Approved packages are added in the phase that first needs them:
#   provider → Faz 4, shared_preferences → Faz 8,
#   audioplayers → Faz 9, confetti → Faz 11.
dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  confetti: ^0.8.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # §33, §34 — licences and attribution live in assets/LICENSES.md.
  assets:
    - assets/images/puzzles/
    - assets/images/ui/
    - assets/audio/sfx/
