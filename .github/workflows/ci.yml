name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.6
          cache: true

      - run: flutter pub get

      # Formatting is part of review, not a discussion.
      - run: dart format --output=none --set-exit-if-changed lib test

      - run: flutter analyze

      - run: flutter test
